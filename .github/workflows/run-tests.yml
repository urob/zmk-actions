name: Test

on:
  workflow_call:
    inputs:
      test-dir:
        description: "Path to the tests directory."
        type: string
        required: false
        default: "tests"

      zmk-version:
        description: "Version of ZMK to test with (default: read from VERSION)"
        type: string
        required: false
        default: ""

      verbose:
        description: "Show detailed build logs."
        type: boolean
        required: false

      toolchain:
        description: "Toolchain if using nix ('gnuarmemb' or 'zephyr')"
        type: string
        required: false
        default: gnuarmemb

jobs:
  run-tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set ZMK version
        run: |
          ZMK_VERSION="${{ inputs.zmk-version }}"
          export ZMK_VERSION="${ZMK_VERSION:-$(cat VERSION)}"
          yq e -i '(.manifest.projects[] | select(.name=="zmk") | .revision) = env(ZMK_VERSION)' \
            ${{ inputs.test-dir }}/west.yml
          cat ${{ inputs.test-dir }}/west.yml

      - name: Set up West and Zephyr SDK
        uses: urob/zmk-actions/setup-sdk@v12.0.0
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Pull in ZMK and Zephyr modules
        uses: urob/zmk-actions/setup-zmk@v12.0.0
        id: setup-zmk
        with:
          config: ${{ inputs.test-dir }}
          always-update-west: true

      - name: Test
        uses: urob/zmk-actions/test@v12.0.0
        with:
          verbose: ${{ inputs.verbose }}
          test-dir: ${{ inputs.test-dir }}
          workspace: ${{ steps.setup-zmk.outputs.workspace }}
          zmk-src-dir: ${{ steps.setup-zmk.outputs.zmk-src-dir }}
