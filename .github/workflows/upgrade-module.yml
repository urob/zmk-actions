name: Create a new module release

on:
  workflow_call:
    inputs:
      release_branch:
        description: "Branch to create the release from"
        type: string
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    if:
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'Prepare ZMK release')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch tags
        run: |
          tag=$(cat VERSION)
          echo "patch=${tag}" >>$GITHUB_ENV
          echo "minor=${tag%.*}" >>$GITHUB_ENV
          echo "major=${tag%%.*}" >>$GITHUB_ENV

      - name: Push tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag ${{ env.patch }}
          git tag -f ${{ env.minor }}
          if [ ${{ env.major }} != "v0" ]; then
            git tag -f ${{ env.major }}
          fi

          # Push with an explicit authenticated URL rather than relying on the
          # credentials actions/checkout persists in .git/config.
          git push -f --tags "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}" \
            ${{ github.ref_name }}:${{ inputs.release_branch }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.patch }}" --draft --title "${{ env.patch }}" \
            --verify-tag --generate-notes

